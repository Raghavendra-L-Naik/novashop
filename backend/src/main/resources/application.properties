
spring.application.name=novashop
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/novashop_db
spring.datasource.username=${DB_USERNAME:novashop_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
